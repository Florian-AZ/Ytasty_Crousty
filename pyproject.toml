[project]
name = "ytasty-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ranya.aitgaghou@ynov.com", email = "ranya.aitgaghou@ynov.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.2",
    "fastapi>=0.141.1",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[project.scripts]
ytasty-backend = "ytasty_backend:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
